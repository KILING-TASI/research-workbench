name: Independent validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RESEARCH_WORKBENCH_LOOKTHROUGH_DIR: ${{ github.workspace }}/_specialists/lookthrough
      RESEARCH_WORKBENCH_FINANCIAL_DIR: ${{ github.workspace }}/_specialists/financial
      RESEARCH_WORKBENCH_MARKETLENS_DIR: ${{ github.workspace }}/_specialists/marketlens
      RESEARCH_WORKBENCH_PORTFOLIO_DIR: ${{ github.workspace }}/_specialists/portfolio
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out pinned specialist cn-fund-lookthrough
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: KILING-TASI/cn-fund-lookthrough
          ref: a24f807dee3e8a0ff8ea3f96dd836f868abc3b64
          path: _specialists/lookthrough
          persist-credentials: false
      - name: Check out pinned specialist cn-financial-reconcile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: KILING-TASI/cn-financial-reconcile
          ref: e8d57a9858570e16fa6aca62aa95cd2b48e3b3f2
          path: _specialists/financial
          persist-credentials: false
      - name: Check out pinned specialist portfolio-decision-engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: KILING-TASI/portfolio-decision-engine
          ref: caeaabe8ca902c4236887f074ba5d8a638509413
          path: _specialists/portfolio
          persist-credentials: false
      - name: Check out pinned specialist marketlens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: KILING-TASI/marketlens
          ref: 444d82813c246190f5660f3632b533d89149b5b6
          path: _specialists/marketlens
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check -r references/requirements-optional.txt -c references/constraints-tested.txt
      - name: Run main package regression
        run: python -B -m unittest discover -s scripts -p "test*.py"
      - name: Run JavaScript regression
        run: python -B .github/scripts/validate_js.py
      - name: Check standard-library examples
        run: |
          python -B -S scripts/environment_check.py --out "${{ runner.temp }}/research-workbench-smoke/environment.json"
          python -B -S scripts/retail_research.py references/examples/news-example.json --out-dir "${{ runner.temp }}/research-workbench-smoke/news"
          python -B -S scripts/fund_comparison_brief.py references/examples/comparison-example.json --out-dir "${{ runner.temp }}/research-workbench-smoke/comparison"
          python -B -S scripts/start.py demo --out-dir "${{ runner.temp }}/research-workbench-smoke/quick-comparison"
          python -B -S scripts/start.py snapshot --input references/examples/holdings-example.csv --as-of 2026-10-08 --out-dir "${{ runner.temp }}/research-workbench-smoke/holdings-snapshot"
